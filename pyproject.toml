[project]
name = "openpnm"
dynamic = ["version"]
description = "A framework for conducting pore network modeling simulations of multiphase transport in porous materials"
authors = [{ name = "OpenPNM Team", email = "jgostick@gmail.com" }]
maintainers = [
    { name = "Jeff Gostick", email = "jgostick@gmail.com" },
    { name = "Amin Sadeghi", email = "amin.sadeghi@live.com" },
]
license = "MIT"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
readme = "README.md"
requires-python = ">=3.11,<=3.13"
dependencies = [
    "docrep>=0.3.2",
    "h5py>=3.14.0",
    "jsonschema>=4.25.1",
    "llvmlite>=0.44",
    "matplotlib>=3.10.6",
    "networkx>=3.5",
    "numba>=0.61",
    "numpy<2.2",
    "pandas>=2.3.2",
    "pyamg>=5.3.0",
    "rich>=14.1.0",
    "scikit-image>=0.25.2",
    "scipy>=1.16.2",
    "sympy>=1.14.0",
    "tqdm>=4.67.1",
    "transforms3d>=0.4.2",
]

[project.optional-dependencies]
extras = [
    "pypardiso",
]
test = [
    "codecov",
    "coverage",
    "nbval",
    "pytest",
    "pytest-cache",
    "pytest-cov",
    "pytest-custom-exit-code",
    "pytest-split",
]
docs = [
    "mock",
    "myst-nb",
    "nbstripout>=0.8.1",
    "pandoc",
    "pydata-sphinx-theme",
    "sphinx",
    "sphinx-autoapi",
    "sphinx-copybutton",
    "sphinx-design",
    "tensorflow",
]
interactive = [
    "ipython",
    "ipykernel",
    "ipywidgets",
    "jupyter",
    "jupyterlab_widgets",
]
